name: Build Artifacts
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  release:
    types: [created]
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.ref) || format('build-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ github.event_name == 'release' || steps.filter.outputs.tests }}
      container: ${{ github.event_name == 'release' || steps.filter.outputs.container }}
    steps:
      - name: Checkout push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'release'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          filters: |
            tests:
              - '.github/workflows/build.yml'
              - 'Dockerfile'
              - 'Makefile'
              - 'pytest.ini'
              - 'requirements.txt'
              - 'test-requirements.txt'
              - 'src/**'
              - 'tests/**'
            container:
              - '.github/workflows/build.yml'
              - 'Dockerfile'
              - 'requirements.txt'
              - 'src/**'

  test:
    name: Run Python tests
    needs: changes
    if: needs.changes.outputs.tests != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: test-requirements.txt
      - name: Run tests
        run: make test

  multiplatform_build:
    name: Build container image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.container != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          no-cache: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: false

  publish_image:
    name: Publish container image
    needs: [changes, test]
    if: >-
      (github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      needs.changes.result == 'success' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/qubership-graylog-auth-proxy
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          no-cache: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  ci_gate:
    name: CI Gate
    needs: [changes, test, multiplatform_build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require validation when applicable
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.tests != 'false' && needs.test.result != 'success') ||
          (needs.changes.outputs.container != 'false' && needs.multiplatform_build.result != 'success')
        run: exit 1
